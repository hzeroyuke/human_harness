name: Trajectory Pages

on:
  push:
    branches: [feat/trajectory-explorer]
    paths:
      - site/**
      - scripts/check-humanize-benchmark.mjs
      - scripts/check-humanize-benchmark.test.mjs
      - scripts/check-humanize-full-task.mjs
      - scripts/check-humanize-full-task.test.mjs
      - scripts/check-humanize-full-task-ui.test.mjs
      - scripts/humanize-full-task-model-options.ts
      - scripts/humanize-full-task-model-options.test.mjs
      - scripts/humanize-full-task-limits.ts
      - scripts/humanize-full-task-limits.test.mjs
      - scripts/replay-humanize-message.ts
      - scripts/replay-humanize-message.test.mjs
      - packages/coding-agent/src/core/humanize.ts
      - packages/coding-agent/src/core/usage-totals.ts
      - .github/workflows/trajectory-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trajectory-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/feat/trajectory-explorer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the publication validator
        run: node --test scripts/check-humanize-benchmark.test.mjs scripts/check-humanize-full-task.test.mjs
      - name: Check experiment settings and trajectory selection
        run: node --test scripts/humanize-full-task-limits.test.mjs scripts/humanize-full-task-model-options.test.mjs scripts/check-humanize-full-task-ui.test.mjs
      - name: Validate complete public trajectories
        run: node scripts/check-humanize-benchmark.mjs site/data/benchmark.json
      - name: Validate full task message pairing
        run: node scripts/check-humanize-full-task.mjs site/data/full-task.json
      - name: Replay saved protection failure without model calls
        run: node --import ./packages/coding-agent/src/experimental/source-resolver.ts --test scripts/replay-humanize-message.test.mjs
      - name: Package static website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        # Initial enablement is an administrator setting; GITHUB_TOKEN cannot enable it.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
